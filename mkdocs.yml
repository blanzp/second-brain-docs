site_name: Unibrain
site_description: Give every AI agent your notes and stay in control. A Markdown vault in your own GitHub repo, shared by Claude, ChatGPT and your agents, with a signed record of every change and a phone app to review it.
site_url: https://docs.unibrain.dev/
repo_url: https://github.com/blanzp/second-brain-docs
repo_name: second-brain-docs
edit_uri: edit/main/docs/
copyright: Unibrain · notes you own, agents you can trust

theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Why Unibrain: why.md
  - Get started:
      - get-started/index.md
      - 0. Create a GitHub account: get-started/github-account.md
      - 1. Create your vault: get-started/vault.md
      - 2. Install the GitHub App: get-started/github-app.md
      - 3. Request access: get-started/access.md
      - 4. Open the web app: get-started/web-app.md
  - Connect your AI:
      - connect/index.md
      - Claude: connect/claude.md
      - ChatGPT: connect/chatgpt.md
      - Claude Code: connect/claude-code.md
      - Hermes: connect/hermes.md
      - Other MCP clients: connect/other.md
  - Use cases: use-cases.md
  - Features:
      - features/index.md
      - Agents and MCP: features/agents.md
      - Trust and safety: features/safety.md
      - The web app: features/web-app.md
      - Writing: features/editor.md
      - Tasks: features/tasks.md
      - Offline reading: features/offline.md
      - Diagrams and math: features/diagrams.md
      - Slides: features/slides.md
      - Organizing: features/organize.md
      - Vault settings: features/settings.md
      - Usage stats: features/stats.md
      - Mission control (alpha): features/mission-control.md
  - Guides:
      - Write your AGENTS.md: guides/agents-md.md
      - Name your agents: guides/named-agents.md
      - Run a team of agents: guides/multi-agent.md
      - Note-writing syntax: guides/markdown.md
      - Moving from Obsidian: guides/obsidian.md
  - Reference:
      - MCP tools: reference/tools.md
      - Privacy and security: reference/privacy.md
      - FAQ: reference/faq.md
      - Troubleshooting: reference/troubleshooting.md
      - What's new: reference/whats-new.md
